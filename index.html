<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>LJC Design Studio — Logo, Branding &amp; Print Design</title>
<meta name="description" content="LJC Design Studio is a graphic design studio specialising in logo design, branding, print and social media management.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Mrs+Saint+Delafield&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<a class="skip-link" href="#top">Skip to content</a>

<header class="site-header">
  <div class="header-inner">
    <a href="#top" class="brand">
      <img src="images/logo-transparent.png" alt="LJC Design Studio" class="brand-logo">
    </a>

    <button class="menu-toggle" id="menu-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="nav-drawer">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<nav class="nav-drawer" id="nav-drawer" aria-hidden="true">
  <ul>
    <li style="--i:0"><a href="#work">Work</a></li>
    <li style="--i:1"><a href="#services">Services</a></li>
    <li style="--i:2"><a href="#about">About</a></li>
    <li style="--i:3"><a href="#contact">Contact</a></li>
  </ul>
</nav>

<main id="top">

  <section class="hero">
    <p class="pill">Get a Design Quote</p>
    <h1 class="hero-headline">
      <span class="headline-main">
        <span class="word" style="--i:0">A</span>
        <span class="word" style="--i:1">logo</span>
        <span class="word" style="--i:2">&amp;</span>
        <span class="word" style="--i:3">branding</span>
        <span class="word" style="--i:4">studio.</span>
        <span class="word" style="--i:5">Built</span>
        <span class="word" style="--i:6">on</span>
        <span class="word" style="--i:7">detail.</span>
      </span>
      <span class="headline-accent">
        <span class="word" style="--i:8">Designed</span>
        <span class="word" style="--i:9">to</span>
        <span class="word" style="--i:10">be</span>
        <span class="word" style="--i:11">remembered.</span>
      </span>
    </h1>
  </section>

  <section class="marquee" id="work" aria-label="Selected work">
    <div class="marquee-track">
      <img src="images/work-hairloss-signage.jpg" alt="Hair Loss Clinic UK wall signage in a clinic interior">
      <img src="images/work-blend-signage.jpg" alt="Blend Studio metallic wall signage in a salon">
      <img src="images/work-hairloss-product.jpg" alt="Hair Loss Clinic UK branded product bottle">
      <img src="images/work-skin-voucher.jpg" alt="SKIN Beauty branded gift voucher">
      <img src="images/work-blend-towels.jpg" alt="Blend Studio branded towels folded in a salon">
      <img src="images/work-hairloss-brochure.jpg" alt="Hair Loss Clinic UK brochure display on a salon counter">
      <img src="images/work-blend-shelf.jpg" alt="Blend Studio branded product bottles on a salon shelf">

      <img src="images/work-hairloss-signage.jpg" alt="" aria-hidden="true">
      <img src="images/work-blend-signage.jpg" alt="" aria-hidden="true">
      <img src="images/work-hairloss-product.jpg" alt="" aria-hidden="true">
      <img src="images/work-skin-voucher.jpg" alt="" aria-hidden="true">
      <img src="images/work-blend-towels.jpg" alt="" aria-hidden="true">
      <img src="images/work-hairloss-brochure.jpg" alt="" aria-hidden="true">
      <img src="images/work-blend-shelf.jpg" alt="" aria-hidden="true">
    </div>
  </section>

</main>

<script src="js/script.js"></script>
</body>
</html>
